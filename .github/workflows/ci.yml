name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, DB policies, web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx jest --ci

      - name: Supabase migration + RLS smoke test
        run: npm run verify:db

      - name: Web export
        run: npx expo export -p web

      - name: Native bundles (iOS + Android)
        run: |
          npx expo export -p ios --output-dir dist-native/ios
          npx expo export -p android --output-dir dist-native/android
